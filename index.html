<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Date Cluster Inspector</title></head><body><p style="font-family:system-ui;padding:20px">Loading Date Cluster Inspector…</p><script>(async()=>{try{
const corePaths=['./index.part1.txt','./index.part2.txt','./index.part3.txt','./index.part4.txt','./index.part5.txt','./index.part6.txt'];
const [coreParts,pa,pb]=await Promise.all([
  Promise.all(corePaths.map(p=>fetch(p+'?v=279',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(p+' '+r.status);return r.text()}))),
  fetch('./core_patch_2612_a.txt?v=279',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('patch A '+r.status);return r.text()}),
  fetch('./core_patch_2612_b.txt?v=279',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('patch B '+r.status);return r.text()})
]);
let html=coreParts.join('');
const patch=pa+pb;
const marker='// Direct picker remains only as a fallback.';
if(!html.includes(marker))throw new Error('CORE RESTORE POINT NOT FOUND');
html=html.replace(marker,patch+'\n\n'+marker);
const required=['function buildSlots()','function assignSlots()','function renderFileList()','function rgbToHsv(','function detectClusterROIs(','function estimateFruitEquivalents(','function analyzeCanvas(','function imageFileToFrame(','function videoFileToFrames(','function aggregateFrames(','function renderFileResult(','function computeTreeRankings(','function renderMap1(','function renderRoute(','function drainSharedPhotos('];
const missing=required.filter(x=>!html.includes(x));
if(missing.length)throw new Error('CORE INTEGRITY FAILURE — missing: '+missing.join(', '));
html=html.replace(/<meta\s+http-equiv=["']Content-Security-Policy["'][^>]*>/ig,'<meta http-equiv="Content-Security-Policy" content="default-src \'self\' blob: data:; img-src \'self\' blob: data:; media-src \'self\' blob: data:; style-src \'self\' \'unsafe-inline\'; script-src \'self\' \'unsafe-inline\' blob:; worker-src \'self\' blob:; connect-src \'self\' blob: data:; manifest-src \'self\';">');
html=html.replace(/LOCAL VISION ·[^<]*/,'LOCAL VISION · PWA 2.7.9 · CORE 2.6.12');
html=html.replace('</head>',`<style>
body{padding-bottom:116px!important}
/* Always show the original v2.6.12 classified frame and grade after analysis. */
.resultBody{display:block!important}
#dci279Bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:10000;background:#fff;border:1px solid #cfe1d2;border-radius:16px;padding:10px;box-shadow:0 10px 34px rgba(20,60,32,.22)}
#dci279Btn{display:block;width:100%;min-height:54px;border:0;border-radius:12px;background:#218c55;color:#fff;font-weight:900;font-size:16px}
#dci279Btn.warn{background:#b66a19}
#dci279Hint{margin:7px 4px 0;color:#68806c;font-size:11px;line-height:1.35;text-align:center}
#dciPlantationWarning{display:none;margin:0 0 12px;padding:12px 14px;border-radius:12px;background:#fff4df;border:1px solid #e8bd7b;color:#7b4a13;font-size:13px;line-height:1.45}
</style></head>`);
html=html.replace('<div class="card">\n    <div class="btnrow" style="gap:10px;flex-wrap:wrap;margin-bottom:10px">','<div id="dciPlantationWarning"><b>Plantation layout is missing in this installed PWA.</b> Save the row/tree layout once in Setup before analysis. Without it, photos cannot be assigned to trees and therefore cannot appear on the map.</div><div class="card">\n    <div class="btnrow" style="gap:10px;flex-wrap:wrap;margin-bottom:10px">');
html=html.replace('</body>',`<script>(()=>{
let last=-1;
const count=()=>{try{return (APP.files||[]).filter(f=>f&&f.type==='image').length}catch(_){return 0}};
const hasPlantation=()=>{try{return Array.isArray(APP.rows)&&APP.rows.length>0&&APP.rows.some(r=>Number(r.count)>0)}catch(_){return false}};
function ensure(){if(document.getElementById('dci279Bar'))return;const x=document.createElement('div');x.id='dci279Bar';x.className='noprint';x.innerHTML='<button id="dci279Btn" type="button"></button><div id="dci279Hint"></div>';document.body.appendChild(x);document.getElementById('dci279Btn').onclick=act}
function refresh(){ensure();const n=count(),ok=hasPlantation(),b=document.getElementById('dci279Btn'),h=document.getElementById('dci279Hint'),w=document.getElementById('dciPlantationWarning');last=n;b.disabled=false;b.classList.toggle('warn',!ok&&n>0);if(w)w.style.display=ok?'none':'block';if(n&&!ok){b.textContent='SET PLANTATION BEFORE ANALYSIS';h.textContent=n+' photo'+(n===1?'':'s')+' are queued, but there is no saved row/tree layout in this PWA. They cannot be placed on the map yet.';return}if(n){b.textContent='ANALYZE ALL '+n+' PHOTO'+(n===1?'':'S');h.textContent=n+' photo'+(n===1?'':'s')+' are assigned to the saved plantation layout. Classified images open automatically after analysis.'}else{b.textContent='UPDATE APP';h.textContent='PWA 2.7.9 · core 2.6.12. Gallery → select many → Share → Date Cluster Inspector.'}}
async function act(){const n=count();if(n&&!hasPlantation()){document.querySelector('[data-tab="setup"]')?.click();setTimeout(()=>{document.getElementById('nrows')?.scrollIntoView({behavior:'smooth',block:'center'});alert('Save the plantation row/tree layout once in Setup. Then the queued photos can be assigned to trees and shown on the map.')},120);return}if(n){document.querySelector('[data-tab="analyze"]')?.click();setTimeout(()=>document.getElementById('runBtn')?.click(),100);return}const b=document.getElementById('dci279Btn');b.disabled=true;b.textContent='UPDATING…';try{const reg=await navigator.serviceWorker?.getRegistration('./');if(reg){await reg.update();if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'})}}catch(_){}setTimeout(()=>location.replace('./?v=279-'+Date.now()),700)}
window.addEventListener('load',()=>{
  ensure();refresh();
  const run=document.getElementById('runBtn');
  if(run)run.addEventListener('click',e=>{if(!hasPlantation()){e.preventDefault();e.stopImmediatePropagation();document.querySelector('[data-tab="setup"]')?.click();setTimeout(()=>alert('Plantation layout is missing. Save rows and tree counts once before analysis so every photo has a tree and the map can be built.'),100)}},true);
  const save=document.getElementById('saveSetupBtn');
  if(save)save.addEventListener('click',()=>setTimeout(()=>{try{if(hasPlantation()&&APP.files?.length){assignSlots();renderFileList();showPickerDiagnostic('<b>Plantation saved.</b> Queued photos were assigned to tree/side slots. Press Analyze All Photos.',false)}refresh()}catch(_){}},50));
  setInterval(()=>{const n=count();if(n!==last)refresh()},500)
});
setTimeout(()=>{ensure();refresh()},300)
})();<\/script></body>`);
document.open();document.write(html);document.close();
}catch(e){document.body.innerHTML='<div style="font-family:system-ui;padding:28px;color:#8b1e1e"><h2>Date Cluster Inspector could not load</h2><p>'+String(e)+'</p><button onclick="location.replace(\'./?v=279-\'+Date.now())" style="font:700 18px system-ui;padding:14px 20px">RETRY UPDATE</button></div>'}})()</script></body></html>
