<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Date Cluster Inspector</title></head><body><p style="font-family:system-ui;padding:20px">Loading Date Cluster Inspector…</p><script>(async()=>{try{const ps=["./index.part1.txt","./index.part2.txt","./index.part3.txt","./index.part4.txt","./index.part5.txt","./index.part6.txt"];const r=await Promise.all(ps.map(p=>fetch(p,{cache:'no-store'}).then(x=>{if(!x.ok)throw new Error(p+' '+x.status);return x.text()})));document.open();document.write(r.join(''));document.close()}catch(e){document.body.innerHTML='<pre style="white-space:pre-wrap;font-family:system-ui;padding:20px">Could not load Date Cluster Inspector: '+String(e)+'</pre>'}})()</script></body></html>
